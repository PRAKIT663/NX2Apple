name: Dragon Ball iPhone preflight

on:
  push:
    branches: [experiment/dragon-ball-iphone]
    paths:
      - '.github/workflows/dragon-ball-preflight.yml'
      - 'tools/activation/DragonBallActivation.h'
      - 'tools/activation/apply_ios_gate.py'
      - 'tools/activation/apply_ios_preferences.py'
      - 'tools/activation/combat-touch-icons.patch'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      EXPECTED_UPDATE_DISPLAY: "2.0.74"
      DM_GAME: '010035F022078000'
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout activation integration
        uses: actions/checkout@v4
        with:
          path: activation-integration
          persist-credentials: false
          sparse-checkout: tools/activation

      - name: Checkout pinned BC fallback engine
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative-nobc
          ref: 634829096267587aed7a578cdcc2ea72ed77ecd8
          path: engine
          persist-credentials: false

      - name: Check the activation gate with the iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 activation-integration/tools/activation/apply_ios_gate.py engine
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -fobjc-arc -fsyntax-only -x objective-c \
            -include UIKit/UIKit.h engine/dm/ios/Sources/DragonBallActivation.h
          python3 activation-integration/tools/activation/apply_ios_preferences.py engine
          python3 engine/dm/games/settings.py 010035F022078000 "$RUNNER_TEMP" "$RUNNER_TEMP/no-control.nacp" "$RUNNER_TEMP/dragon-ball-launcher.json"
          python3 - "$RUNNER_TEMP/dragon-ball-launcher.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as source:
              settings = json.load(source)["settings"]
          fps = next(row for row in settings if row["env"] == "DM_FPS_TARGET")
          assert fps["default"] == "30", fps
          assert {"30", "60"} <= {value for value, _ in fps["options"]}, fps
          PY
          git -C engine diff --check

      - name: Verify Dragon Ball profile and rendering prerequisites
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=dm/games:dm/tools:dm/gfx/tools python3 - <<'PY'
          import ast
          import inspect
          import os
          from pathlib import Path

          import game
          import romfs
          import romfs_image
          import uepak

          profile = game.load()
          expected = {
              "fps_target": "60",
              "package": "v327680",
              "shader_versions": "v327680",
              "romfs_marker": "SparkingZERO/Content/Paks/pakchunk0-Switch.pak",
          }
          if profile.title_id != 0x010035F022078000:
              raise SystemExit("Incorrect Dragon Ball title ID")
          for key, value in expected.items():
              if profile.get(key) != value:
                  raise SystemExit(f"Unexpected Dragon Ball profile setting: {key}")

          build = profile.builds()["v327680"]
          if build["display"] != "2.0.76" or build["main"] != "68edafd68c7bc1a1af50b82aac838018":
              raise SystemExit("Incorrect Dragon Ball version 2.0.76 build")
          for name in ("shader_map.tsv", "shader_facts.tsv", "shader_map.tsv.conflicts.tsv"):
              if not profile.table(name).stat().st_size:
                  raise SystemExit(f"Missing shader table data: {name}")

          # Exercise the engine's selection rule with a synthetic CNMT version.
          # The real CNMT version must be read from the user's update before building.
          builder = ast.parse(Path("scripts/build_ipa_from_nsp.py").read_text(encoding="utf-8"))
          rule = next(node for node in builder.body
                      if isinstance(node, ast.FunctionDef) and node.name == "profile_derivation_reason")
          namespace = {}
          exec(compile(ast.Module(body=[rule], type_ignores=[]), "<version selection>", "exec"), namespace)
          requires_derivation = namespace["profile_derivation_reason"]
          registered = profile.get("package")
          synthetic_update = "v65536000"
          if synthetic_update in profile.builds():
              raise SystemExit("The unregistered-update fixture is unexpectedly registered")
          if requires_derivation(profile, registered, (registered,)):
              raise SystemExit("Registered update unexpectedly requires shader derivation")
          if not requires_derivation(profile, synthetic_update, (synthetic_update,)):
              raise SystemExit("An unregistered update must derive its own shader tables")
          print(f"Target update {os.environ['EXPECTED_UPDATE_DISPLAY']}: unregistered-version selection passed with synthetic metadata")

          inspect.signature(romfs.reuse_descriptors).bind([])
          inspect.signature(romfs_image.format_mismatches).bind("fixture", progress=None)
          inspect.signature(uepak.pak_shader_sources).bind("fixture", None)

          entrypoint = Path("dm/gfx/tools/dmsh_entry.py")
          shader = ast.parse(entrypoint.read_text(encoding="utf-8"))
          if not any(isinstance(node, ast.FunctionDef) and node.name == "fs_uint" for node in shader.body):
              raise SystemExit("Missing integer fragment output used by the virtual texture fix (#1889)")
          for name in ("nvn_bc2astc.c", "nvn_bcdec.c"):
              if not (Path("dm/gfx/tex") / name).is_file():
                  raise SystemExit(f"Missing iPhone 15 BC fallback source: {name}")
          print("Dragon Ball reference profile 2.0.76 with 60 FPS target, ROMFS APIs, integer shader entry point and BC fallback sources passed")
          PY

          chain=dm/gfx/tools/dmsh_chain.py
          version="$(python3 "$chain")"
          grep -Fx "#define DMSH_CHAIN \"$version\"" dm/gfx/nvn/dmsh_chain.h
          echo "Dragon Ball shader inputs $(python3 "$chain" --inputs)"

          lock=dm/gfx/tools/dmsh_chain.lock
          for sdk in macosx iphoneos; do
            expected="$(awk -F '\t' -v key="metal_$sdk" '$1 == key {print $2}' "$lock")"
            actual="$(xcrun -sdk "$sdk" metal --version | sed -n '1p')"
            if [[ -z "$expected" || "$actual" != "$expected" ]]; then
              echo "::error::Metal $sdk does not match the shader lock. Expected: $expected. Found: $actual"
              exit 1
            fi
            echo "Metal $sdk matches: $actual"
          done
          echo "Dragon Ball preflight passed without game files or IPA compilation."
