name: NxNative - Generic IPA Builder

on:
  push:
    branches: [experiment/demon-slayer-2]
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: "0100AD80208A8000"
      preflight_only:
        description: "On the Demon Slayer 2 experiment branch, validate source only"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/experiment/demon-slayer-2'
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Validate Demon Slayer 2 dispatch
        if: github.ref == 'refs/heads/experiment/demon-slayer-2' && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DEVICE: ${{ inputs.device }}
          PROFILE: ${{ inputs.profile_id }}
        run: |
          set -euo pipefail
          if [[ "$DEVICE" != 'iPhone 15 or older (BC fallback)' || "$PROFILE" != '0100AD80208A8000' ]]; then
            echo "::error::This experiment requires the BC fallback device option and profile 0100AD80208A8000."
            exit 1
          fi

      - name: Checkout pinned Demon Slayer 2 BC fallback engine
        if: github.ref == 'refs/heads/experiment/demon-slayer-2'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative-nobc
          ref: 634829096267587aed7a578cdcc2ea72ed77ecd8
          persist-credentials: false

      - name: Checkout pinned Demon Slayer 2 profile
        if: github.ref == 'refs/heads/experiment/demon-slayer-2'
        uses: actions/checkout@v4
        with:
          repository: igawa6/peanuts-native
          ref: dbbdb852e5fed02aeec6bdaba458f96e6b9c4db1
          path: .peanuts-profile
          sparse-checkout: dm/games/0100AD80208A8000
          persist-credentials: false

      - name: Preflight Demon Slayer 2 profile, ROMFS and shaders
        if: github.ref == 'refs/heads/experiment/demon-slayer-2'
        shell: bash
        env:
          DM_GAME: '0100AD80208A8000'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          script = Path("scripts/build_ipa_from_nsp.py")
          source = script.read_text(encoding="utf-8")
          guard = '    if not prepare_xcode and free_gb(out_ipa.parent) < 5:'
          if source.count(guard) != 1:
              raise SystemExit("Unexpected native IPA packaging entry point; review the pinned engine")
          cleanup = """    if not prepare_xcode and os.environ.get('NX_DEMON_SLAYER_CLEAN_PACK_INPUTS') == '1':
                  staged = (Path(os.environ['RUNNER_TEMP']) / 'GameFiles').resolve()
                  if nsp_dir != staged or app != 0x0100AD80208A8000 or work != staged / '0100AD80208A8000_build':
                      raise BuildError('Refusing to clean inputs outside the Demon Slayer CI staging folder')
                  before = free_gb(out_ipa.parent)
                  for path in staged.iterdir():
                      if path.is_file() and path.suffix.lower() in {'.nsp', '.xci', '.nsz', '.xcz'}:
                          path.unlink()
                  for path in (sh / 'pkg', sh / 'cache', work / 'nsp'):
                      rmtree(path)
                  say(f'Packaging volume free space after releasing build intermediates: {before:.1f} -> {free_gb(out_ipa.parent):.1f} GB')
          """
          updated = source.replace(guard, cleanup + guard)
          ast.parse(updated, filename=str(script))
          script.write_text(updated, encoding="utf-8")
          PY

          profile_dir="dm/games/$DM_GAME"
          test ! -e "$profile_dir"
          cp -R ".peanuts-profile/$profile_dir" "$profile_dir"
          for table in shader_map shader_facts shader_pairs; do
            test -s "$profile_dir/$table.tsv"
          done

          # Keep the native ROMFS and shader pipeline. Apply Peanuts' asset-only pak classification.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dm/gfx/tools/uepak.py")
          source = path.read_text(encoding="utf-8")
          old = "    return inline, not inline\n"
          if source.count(old) != 1:
              raise SystemExit("Unexpected native Unreal pak classifier; review the pinned engine")
          path.write_text(
              source.replace(old, "    return inline, b'.ushaderbytecode\\0' in d\n"),
              encoding="utf-8",
          )
          PY

          PYTHONPATH=dm/games:dm/tools:dm/gfx/tools python3 - <<'PY'
          import inspect
          import struct
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from pathlib import Path

          import game
          import romfs
          import romfs_image
          import uepak

          profile = game.load()
          # Peanuts has no conflict rulings for this profile. Use nxnative's empty-table
          # format, which leaves the chosen shader sources in shader_map.tsv in effect.
          conflicts = profile.table("shader_map.tsv.conflicts.tsv")
          header = "dm_ctl_sha16\tchosen_pc\tclass\tcandidates\trecords"
          if not conflicts.exists():
              conflicts.write_text(
                  "# kind: evidence  control-section key conflict rulings: empty\n" + header + "\n",
                  encoding="utf-8",
              )
          with conflicts.open(encoding="utf-8") as rows:
              if next((row.strip() for row in rows if row.strip() and not row.startswith("#")), "") != header:
                  raise SystemExit("Invalid shader map conflict table header")
          print("Native shader map conflict table is ready")
          if profile.title_id != 0x0100AD80208A8000:
              raise SystemExit("Incorrect profile title ID")
          if profile.builds()["v917504"]["main"] != "dadf52c97d951fbcc95f1a7468a7fd3e":
              raise SystemExit("Incorrect build ID for Demon Slayer 2 version 1.80")
          if profile.get("romfs_marker") != "APK2/Content/Paks/pakchunk0-Switch.utoc":
              raise SystemExit("Incorrect Unreal IoStore RomFS marker")
          if "v917504" not in profile.words("shader_versions"):
              raise SystemExit("Missing version 1.80 shader profile")
          inspect.signature(romfs.reuse_descriptors).bind([])
          inspect.signature(romfs_image.format_mismatches).bind("fixture", progress=None)
          if b".listing" not in romfs_image.ARTIFACTS:
              raise SystemExit("Missing ROMFS image artifact filter")
          inspect.signature(uepak.pak_shader_sources).bind("fixture", None)
          with TemporaryDirectory() as tmp:
              folder = Path(tmp)
              for name, directory in (
                  ("movie", b"Intro.bk2\0"),
                  ("shared", b"ShaderArchive-Game.ushaderbytecode\0"),
                  ("inline", b"GlobalShaderCache-Switch.bin\0"),
              ):
                  index = struct.pack("<iiQiiQQ", 0, 1, 0, 0, 1, 40, len(directory))
                  footer = bytearray(0xCC + 21)
                  struct.pack_into("<IIQQ", footer, 21, uepak.PAK_MAGIC, 11, 0, len(index))
                  (folder / f"{name}.pak").write_bytes(index + directory + footer)
              with patch.object(uepak, "inline_in_containers", return_value=True):
                  shared = uepak.unreal_paks(tmp, inline=False)
                  inline = uepak.unreal_paks(tmp, inline=True)
              if [Path(p).stem for p in shared] != ["shared"]:
                  raise SystemExit(f"Incorrect shared shader pak selection: {shared}")
              if [Path(p).stem for p in inline] != ["inline"]:
                  raise SystemExit(f"Incorrect inline IoStore pak selection: {inline}")
              print("Unreal pak regression passed: movie excluded, shared and inline routed")
          for source in ("nvn_bc2astc.c", "nvn_bcdec.c"):
              if not (Path("dm/gfx/tex") / source).is_file():
                  raise SystemExit(f"Missing BC fallback source: {source}")
          print("Demon Slayer 2 v1.80 profile, ROMFS APIs, Unreal shader entry point and BC fallback sources passed")
          PY

          chain=dm/gfx/tools/dmsh_chain.py
          version="$(python3 "$chain")"
          grep -Fx "#define DMSH_CHAIN \"$version\"" dm/gfx/nvn/dmsh_chain.h
          echo "Demon Slayer 2 shader inputs $(python3 "$chain" --inputs)"
          echo "Preflight passed without game downloads or compilation."

      - name: Select and verify Demon Slayer 2 Metal compiler
        if: github.ref == 'refs/heads/experiment/demon-slayer-2'
        shell: bash
        run: |
          set -euo pipefail
          lock=dm/gfx/tools/dmsh_chain.lock
          expected_mac="$(awk -F '\t' '$1 == "metal_macosx" {print $2}' "$lock")"
          expected_ios="$(awk -F '\t' '$1 == "metal_iphoneos" {print $2}' "$lock")"
          test -n "$expected_mac" && test -n "$expected_ios"

          metal_version() {
            DEVELOPER_DIR="$1" xcrun -sdk "$2" metal --version | sed -n '1p'
          }

          shopt -s nullglob
          for developer in /Applications/Xcode_27.2.app/Contents/Developer /Applications/Xcode*.app/Contents/Developer; do
            [[ -d "$developer" ]] || continue
            actual_mac="$(metal_version "$developer" macosx)" || continue
            actual_ios="$(metal_version "$developer" iphoneos)" || continue
            echo "$developer: macOS $actual_mac, iOS $actual_ios"
            if [[ "$actual_mac" == "$expected_mac" && "$actual_ios" == "$expected_ios" ]]; then
              echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
              echo "Metal compiler matches the shader lock for macOS and iOS."
              exit 0
            fi
          done

          echo "::error::No installed Xcode matches the shader lock (macOS: $expected_mac, iOS: $expected_ios)."
          exit 1

      - name: Checkout BC fallback version
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/experiment/demon-slayer-2' && inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc

      - name: Checkout standard nxnative version
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/experiment/demon-slayer-2' && inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Free up disk space on macOS runner
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/experiment/demon-slayer-2'
        shell: bash
        env:
          EXPERIMENT: ${{ github.ref == 'refs/heads/experiment/demon-slayer-2' }}
        run: |
          if [[ "$EXPERIMENT" == 'true' ]]; then
            set -e
            df -h "$RUNNER_TEMP"
            selected="$(cd "$DEVELOPER_DIR" && pwd -P)"
            shopt -s nullglob
            for app in /Applications/Xcode*.app; do
              [[ -d "$app/Contents/Developer" && ! -L "$app" ]] || continue
              developer="$(cd "$app/Contents/Developer" && pwd -P)"
              [[ "$developer" != "$selected" ]] || continue
              echo "Removing unused runner toolchain $(basename "$app")"
              sudo rm -rf -- "$app"
            done
            for platform in "$selected"/Platforms/{Watch,AppleTV,XR}*.platform; do
              sudo rm -rf -- "$platform"
            done
          fi

          sudo rm -rf \
            /Applications/Xcode.app/Contents/Developer/Platforms/Watch*.platform \
            /Applications/Xcode.app/Contents/Developer/Platforms/AppleTV*.platform \
            /Applications/Xcode.app/Contents/Developer/Platforms/XR*.platform \
            /Library/Developer/CoreSimulator \
            /Users/runner/Library/Android \
            /Users/runner/Library/Developer/CoreSimulator \
            /usr/local/share/dotnet \
            /Users/runner/.nuget \
            /Users/runner/.cocoapods \
            "/Applications/Microsoft Edge.app" \
            "/Applications/Google Chrome.app" || true
          brew cleanup -s || true
          df -h "$RUNNER_TEMP"

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/experiment/demon-slayer-2' || !inputs.preflight_only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        if: github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/experiment/demon-slayer-2' || !inputs.preflight_only)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/experiment/demon-slayer-2' || !inputs.preflight_only)
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar glslang
          python -m pip install --upgrade pip
          python -m pip install lz4 capstone fonttools backports.zstd gdown zbic

      - name: Download game files and keys
        if: github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/experiment/demon-slayer-2' || !inputs.preflight_only)
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local file_id

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            if [[ "$url" == *"gofile.io"* ]]; then
              echo "Downloading $(basename "$output") from Gofile..."
              curl -L --fail --retry 3 -A "Mozilla/5.0" -o "$output" "$url"
            else
              file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import parse_qs, urlparse

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in ("drive.google.com", "www.drive.google.com"):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(r"[-A-Za-z0-9_]{20,}", url):
              file_id = url

          if not file_id:
              raise SystemExit("Could not extract a Google Drive file ID.")

          print(file_id)
          PY
              )"
              echo "Downloading $(basename "$output")..."
              gdown "$file_id" -O "$output"
            fi

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            file "$output"
          }

          download_file "$GAME_URL" "$WORK/game.download"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

          chmod 600 "$WORK/prod.keys"

      - name: Extract RAR archives or accept direct game packages
        if: github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/experiment/demon-slayer-2' || !inputs.preflight_only)
        shell: bash
        env:
          EXPERIMENT: ${{ github.ref == 'refs/heads/experiment/demon-slayer-2' }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          reclaim_space = os.environ['EXPERIMENT'] == 'true'
          package_extensions = {".nsp", ".xci", ".nsz", ".xcz"}
          rar_signatures = (b"Rar!\x1a\x07\x00", b"Rar!\x1a\x07\x01\x00")

          def validate_package(path: Path):
              with path.open("rb") as f:
                  magic = f.read(4)
                  f.seek(0x100)
                  xci_magic = f.read(4)

              suffix = path.suffix.lower()
              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(f"Invalid {suffix} package signature: {path.name}")
              if suffix in (".xci", ".xcz") and xci_magic != b"HEAD":
                  raise SystemExit(f"Invalid {suffix} package signature: {path.name}")

          def add_package(source: Path, label: str):
              target = game_dir / source.name
              if target.exists():
                  raise SystemExit("Duplicate package filename: " + source.name)

              validate_package(source)
              if reclaim_space:
                  shutil.move(source, target)
              else:
                  shutil.copy2(source, target)
              print(f"Added {label}: {target.name} ({target.stat().st_size:,} bytes)")

          def process_download(label: str):
              source = work / f"{label}.download"
              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              with source.open("rb") as f:
                  signature = f.read(8)
                  f.seek(0x100)
                  xci_sig = f.read(4)

              is_rar = any(signature.startswith(magic) for magic in rar_signatures)
              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)
                  print(f"{label}: RAR archive detected; extracting.")
                  subprocess.run(["unar", "-o", str(extract_dir), str(source)], check=True)

                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file() and p.suffix.lower() in package_extensions
                  )
                  if not packages:
                      raise SystemExit(f"No NSP/XCI/NSZ/XCZ packages found in the {label} RAR archive.")

                  for package in packages:
                      add_package(package, label)
                  if reclaim_space:
                      shutil.rmtree(extract_dir)
                      source.unlink()
              else:
                  print(f"{label}: not a RAR archive; checking as a direct package.")
                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif xci_sig == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive or direct NSP/XCI package."
                      )

                  target = game_dir / f"{label}{extension}"
                  if target.exists():
                      raise SystemExit(f"Output package already exists: {target.name}")

                  shutil.move(str(source), str(target))
                  validate_package(target)
                  print(f"Added direct package: {target.name} ({target.stat().st_size:,} bytes)")

          for item in ("game", "update", "dlc"):
              process_download(item)

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file() and p.suffix.lower() in package_extensions
          )
          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"
          if [[ "$EXPERIMENT" == 'true' ]]; then
            df -h "$GAME_DIR"
          fi

      - name: Detect game title ID and select shader profile
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/experiment/demon-slayer-2'
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          DETECTED_ID=""

          if [[ -z "${PROFILE_OVERRIDE:-}" ]]; then
            DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path: Path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)
                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []
                      count, string_size = struct.unpack_from("<II", header, 4)
                      if count > 100000 or string_size > 100000000:
                          return []
                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)
                      if len(entries) != count * 0x18:
                          return []

                      names = []
                      for i in range(count):
                          offset = struct.unpack_from("<I", entries, i * 0x18 + 0x10)[0]
                          if offset >= len(strings):
                              continue
                          end = strings.find(b"\0", offset)
                          if end >= 0:
                              names.append(strings[offset:end].decode(errors="replace"))
                      return names
              except (OSError, struct.error):
                  return []

          candidates = set()
          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik", name)
                  if match:
                      title_id = int(match.group(1), 16)
                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(r"\[([0-9A-Fa-f]{16})\]", path.name)
              if match:
                  title_id = int(match.group(1), 16)
                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  f"Could not uniquely identify the base game's title ID. Candidates found: {sorted(candidates)}."
              )

          print(next(iter(candidates)))
          PY
            )"
          fi

          PROFILE_ID="$(echo "${PROFILE_OVERRIDE:-$DETECTED_ID}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi

          echo "Detected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      - name: Sync Peanuts game profile, tools, and patches
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/experiment/demon-slayer-2'
        env:
          PEANUTS_REPO_URL: "https://github.com/igawa6/peanuts-native.git"
        shell: bash
        run: |
          set -euo pipefail
          PEANUTS_TMP="/tmp/peanuts"
          rm -rf "$PEANUTS_TMP"

          echo "Syncing game profile $DM_GAME and toolchain from peanuts-native..."
          git clone --depth 1 "$PEANUTS_REPO_URL" "$PEANUTS_TMP"

          GAME_SRC="$PEANUTS_TMP/dm/games/$DM_GAME"
          if [[ ! -d "$GAME_SRC" ]]; then
            echo "::error::Game profile folder not found in peanuts-native: dm/games/$DM_GAME"
            exit 1
          fi

          mkdir -p dm/games dm/tools dm/gfx/tools dm/third_party scripts
          cp -rf "$GAME_SRC" dm/games/
          cp -rf "$PEANUTS_TMP/dm/peanuts" dm/
          cp -rf "$PEANUTS_TMP/dm/tools/." dm/tools/
          cp -rf "$PEANUTS_TMP/dm/gfx/tools/." dm/gfx/tools/
          cp -rf "$PEANUTS_TMP/dm/third_party/ooz" dm/third_party/
          find "$PEANUTS_TMP" \( -name "uepak.py" -o -name "shader_split.py" \) -exec cp -f {} scripts/ \;

          rm -rf "$PEANUTS_TMP"

          sh dm/third_party/ooz/build.sh /tmp/unoodle clang++

          python - <<'PY'
          from pathlib import Path

          patches = {
              Path("dm/tools/romfs_image.py"): (
                  'ARTIFACTS = frozenset({"icon_DarkMode.dat", "icon_LightMode.dat", "control.nacp", "legal_info.xml"})'
              ),
              Path("dm/tools/romfs.py"): (
                  "def reuse_descriptors(*a, **kw): return None"
              ),
          }

          for path, line in patches.items():
              if not path.exists():
                  raise SystemExit(f"Target file for patch not found: {path}")
              content = path.read_text(encoding="utf-8")
              if line not in content:
                  path.write_text(content.rstrip() + "\n\n" + line + "\n", encoding="utf-8")
                  print(f"Patched {path}")
              else:
                  print(f"Already patched {path}")
          PY

          CHAIN_SCRIPT="$(find . -name dmsh_chain.py -type f -print -quit)"
          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi

          python "$CHAIN_SCRIPT" --header

      - name: Build unsigned IPA
        if: github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/experiment/demon-slayer-2' || !inputs.preflight_only)
        env:
          EXPERIMENT: ${{ github.ref == 'refs/heads/experiment/demon-slayer-2' }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          if [[ "$EXPERIMENT" == 'true' ]]; then
            export NX_DEMON_SLAYER_CLEAN_PACK_INPUTS=1
            build_args=(--title-id 0100AD80208A8000 --package v917504)
          else
            export DM_OODLE_OOZ="/tmp/unoodle"
            export DM_UE_DECODE=""
            build_args=(--allow-other-metal)
          fi

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT" \
            "${build_args[@]}"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success() && github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/experiment/demon-slayer-2' || !inputs.preflight_only)
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always() && github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/experiment/demon-slayer-2' || !inputs.preflight_only)
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always() && github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/experiment/demon-slayer-2' || !inputs.preflight_only)
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
