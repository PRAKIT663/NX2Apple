name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: "0100AD80208A8000"

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Checkout BC fallback version
        if: inputs.device == 'iPhone 15 or older (BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: mianmuhammadse/nxnative
          ref: no-bc

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Free up disk space on macOS runner
        run: |
          sudo rm -rf \
            /Applications/Xcode.app/Contents/Developer/Platforms/Watch*.platform \
            /Applications/Xcode.app/Contents/Developer/Platforms/AppleTV*.platform \
            /Applications/Xcode.app/Contents/Developer/Platforms/XR*.platform \
            /Library/Developer/CoreSimulator \
            /Users/runner/Library/Android \
            /Users/runner/Library/Developer/CoreSimulator \
            /usr/local/share/dotnet \
            /Users/runner/.nuget \
            /Users/runner/.cocoapods \
            "/Applications/Microsoft Edge.app" \
            "/Applications/Google Chrome.app" || true
          brew cleanup -s || true
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar glslang
          python -m pip install --upgrade pip
          python -m pip install lz4 capstone fonttools backports.zstd gdown zbic

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local file_id

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            if [[ "$url" == *"gofile.io"* ]]; then
              echo "Downloading $(basename "$output") from Gofile..."
              curl -L --fail --retry 3 -A "Mozilla/5.0" -o "$output" "$url"
            else
              file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import parse_qs, urlparse

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in ("drive.google.com", "www.drive.google.com"):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(r"[-A-Za-z0-9_]{20,}", url):
              file_id = url

          if not file_id:
              raise SystemExit("Could not extract a Google Drive file ID.")

          print(file_id)
          PY
              )"
              echo "Downloading $(basename "$output")..."
              gdown "$file_id" -O "$output"
            fi

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            file "$output"
          }

          download_file "$GAME_URL" "$WORK/game.download"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

          chmod 600 "$WORK/prod.keys"

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {".nsp", ".xci", ".nsz", ".xcz"}
          rar_signatures = (b"Rar!\x1a\x07\x00", b"Rar!\x1a\x07\x01\x00")

          def validate_package(path: Path):
              with path.open("rb") as f:
                  magic = f.read(4)
                  f.seek(0x100)
                  xci_magic = f.read(4)

              suffix = path.suffix.lower()
              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(f"Invalid {suffix} package signature: {path.name}")
              if suffix in (".xci", ".xcz") and xci_magic != b"HEAD":
                  raise SystemExit(f"Invalid {suffix} package signature: {path.name}")

          def add_package(source: Path, label: str):
              target = game_dir / source.name
              if target.exists():
                  raise SystemExit("Duplicate package filename: " + source.name)

              validate_package(source)
              shutil.copy2(source, target)
              print(f"Added {label}: {target.name} ({target.stat().st_size:,} bytes)")

          def process_download(label: str):
              source = work / f"{label}.download"
              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              with source.open("rb") as f:
                  signature = f.read(8)
                  f.seek(0x100)
                  xci_sig = f.read(4)

              is_rar = any(signature.startswith(magic) for magic in rar_signatures)
              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)
                  print(f"{label}: RAR archive detected; extracting.")
                  subprocess.run(["unar", "-o", str(extract_dir), str(source)], check=True)

                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file() and p.suffix.lower() in package_extensions
                  )
                  if not packages:
                      raise SystemExit(f"No NSP/XCI/NSZ/XCZ packages found in the {label} RAR archive.")

                  for package in packages:
                      add_package(package, label)
              else:
                  print(f"{label}: not a RAR archive; checking as a direct package.")
                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif xci_sig == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(
                          f"{label} is not a recognized RAR archive or direct NSP/XCI package."
                      )

                  target = game_dir / f"{label}{extension}"
                  if target.exists():
                      raise SystemExit(f"Output package already exists: {target.name}")

                  shutil.move(str(source), str(target))
                  validate_package(target)
                  print(f"Added direct package: {target.name} ({target.stat().st_size:,} bytes)")

          for item in ("game", "update", "dlc"):
              process_download(item)

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file() and p.suffix.lower() in package_extensions
          )
          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"

      - name: Detect game title ID and select shader profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          DETECTED_ID=""

          if [[ -z "${PROFILE_OVERRIDE:-}" ]]; then
            DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}

          def pfs0_names(path: Path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)
                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []
                      count, string_size = struct.unpack_from("<II", header, 4)
                      if count > 100000 or string_size > 100000000:
                          return []
                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)
                      if len(entries) != count * 0x18:
                          return []

                      names = []
                      for i in range(count):
                          offset = struct.unpack_from("<I", entries, i * 0x18 + 0x10)[0]
                          if offset >= len(strings):
                              continue
                          end = strings.find(b"\0", offset)
                          if end >= 0:
                              names.append(strings[offset:end].decode(errors="replace"))
                      return names
              except (OSError, struct.error):
                  return []

          candidates = set()
          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              for name in pfs0_names(path):
                  match = re.fullmatch(r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik", name)
                  if match:
                      title_id = int(match.group(1), 16)
                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(r"\[([0-9A-Fa-f]{16})\]", path.name)
              if match:
                  title_id = int(match.group(1), 16)
                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  f"Could not uniquely identify the base game's title ID. Candidates found: {sorted(candidates)}."
              )

          print(next(iter(candidates)))
          PY
            )"
          fi

          PROFILE_ID="$(echo "${PROFILE_OVERRIDE:-$DETECTED_ID}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi

          echo "Detected base title ID: $DETECTED_ID"
          echo "Shader profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"

      - name: Sync Peanuts game profile, tools, and patches
        env:
          PEANUTS_REPO_URL: "https://github.com/igawa6/peanuts-native.git"
        shell: bash
        run: |
          set -euo pipefail
          PEANUTS_TMP="/tmp/peanuts"
          rm -rf "$PEANUTS_TMP"

          echo "Syncing game profile $DM_GAME and toolchain from peanuts-native..."
          git clone --depth 1 "$PEANUTS_REPO_URL" "$PEANUTS_TMP"

          GAME_SRC="$PEANUTS_TMP/dm/games/$DM_GAME"
          if [[ ! -d "$GAME_SRC" ]]; then
            echo "::error::Game profile folder not found in peanuts-native: dm/games/$DM_GAME"
            exit 1
          fi

          mkdir -p dm/games dm/tools dm/gfx/tools dm/third_party scripts
          cp -rf "$GAME_SRC" dm/games/
          cp -rf "$PEANUTS_TMP/dm/peanuts" dm/
          cp -rf "$PEANUTS_TMP/dm/tools/." dm/tools/
          cp -rf "$PEANUTS_TMP/dm/gfx/tools/." dm/gfx/tools/
          cp -rf "$PEANUTS_TMP/dm/third_party/ooz" dm/third_party/
          find "$PEANUTS_TMP" \( -name "uepak.py" -o -name "shader_split.py" \) -exec cp -f {} scripts/ \;

          rm -rf "$PEANUTS_TMP"

          sh dm/third_party/ooz/build.sh /tmp/unoodle clang++

          python - <<'PY'
          from pathlib import Path

          patches = {
              Path("dm/tools/romfs_image.py"): (
                  'ARTIFACTS = frozenset({"icon_DarkMode.dat", "icon_LightMode.dat", "control.nacp", "legal_info.xml"})'
              ),
              Path("dm/tools/romfs.py"): (
                  "def reuse_descriptors(*a, **kw): return None"
              ),
          }

          for path, line in patches.items():
              if not path.exists():
                  raise SystemExit(f"Target file for patch not found: {path}")
              content = path.read_text(encoding="utf-8")
              if line not in content:
                  path.write_text(content.rstrip() + "\n\n" + line + "\n", encoding="utf-8")
                  print(f"Patched {path}")
              else:
                  print(f"Already patched {path}")
          PY

          CHAIN_SCRIPT="$(find . -name dmsh_chain.py -type f -print -quit)"
          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi

          python "$CHAIN_SCRIPT" --header

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          export DM_OODLE_OOZ="/tmp/unoodle"
          export DM_UE_DECODE=""

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT" \
            --allow-other-metal

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA-${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'BC-Fallback' || 'Standard' }}
          path: ${{ runner.temp }}/NxNative.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
